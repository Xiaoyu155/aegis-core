[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-core"
version = "1.2.0"
description = "Deterministic control kernel with causal traces"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aegis = "aegis_core.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.24"]
training = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["aegis_core*"]

[tool.setuptools.package-data]
aegis_core = ["data/feature_encoder.json", "data/model_weights.json", "data/replay_anchors.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
