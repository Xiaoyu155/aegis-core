[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-core"
version = "0.1.0"
description = "Deterministic control kernel with causal traces"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aegis = "aegis_core.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["aegis_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
