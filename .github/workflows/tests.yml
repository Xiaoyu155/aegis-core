name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core and pytest
        if: matrix.os != 'windows-latest' || matrix.python != '3.11'
        run: python -m pip install -e ".[test]"
      - name: Run complete suite
        if: matrix.os != 'windows-latest' || matrix.python != '3.11'
        run: python -m pytest -v
      - name: Windows local handoff bootstrap (includes full pytest suite)
        if: matrix.os == 'windows-latest' && matrix.python == '3.11'
        shell: pwsh
        run: '& ./scripts/bootstrap_local.ps1'
