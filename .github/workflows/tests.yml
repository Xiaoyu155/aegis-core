name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
        suite: [full, v16-gates]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.suite }} / ${{ matrix.os }} / Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chinese font for visual asset checks
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install core and pytest
        if: matrix.suite != 'full' || matrix.os != 'windows-latest' || matrix.python != '3.11'
        run: python -m pip install -e ".[test]"
      - name: Verify Windows signing-key provisioning
        if: matrix.suite == 'full' && matrix.os == 'windows-latest' && matrix.python == '3.12'
        run: python -m pytest -q "tests/test_luna_initialize.py::test_key_generation_and_idempotency[keys]"
      - name: Run complete suite
        if: matrix.suite == 'full' && (matrix.os != 'windows-latest' || matrix.python != '3.11')
        run: python -m pytest -v
      - name: Windows local handoff bootstrap (includes full pytest suite)
        if: matrix.suite == 'full' && matrix.os == 'windows-latest' && matrix.python == '3.11'
        shell: pwsh
        run: '& ./scripts/bootstrap_local.ps1 -TestOnly'
      - name: Run v1.1 invariant, sampling and merge preflight gates
        if: matrix.suite == 'v16-gates'
        run: python -m pytest -q tests/test_v16_frontend_invariants.py tests/test_v16_runtime_sampling.py tests/test_v16_pr_orchestrator.py tests/test_aegis_vs_gpt_zh.py
