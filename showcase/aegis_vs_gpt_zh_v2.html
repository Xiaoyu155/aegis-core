  function drawAt(sec) {

  function glyphMask(ch) {
    const tmp=document.createElement("canvas");tmp.width=128;tmp.height=128;const x=tmp.getContext("2d",{willReadFrequently:true});x.clearRect(0,0,128,128);x.font=font(72);x.textBaseline="top";x.fillStyle="#fff";x.fillText(ch,12,8);return x.getImageData(0,0,128,128).data;

    const chars=new Set((VISIBLE_TEXT.join("")+JSON.stringify(E)).split("").filter(ch=>ch.codePointAt(0)>=128));
